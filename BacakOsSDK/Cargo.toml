[workspace]
resolver = "2"
members = [
    "crates/bacak-ipc",
    "crates/bacak-sdk",
    "crates/bacak-sdk-slint",
    "ornekler/merhaba",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["Anadolu Panteri <bilgi@anadolupanteri.org.tr>"]
repository   = "https://github.com/ortancasamuray/BacakOS"
rust-version = "1.80"

[workspace.dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
freedesktop-icons = { version = "0.4", default-features = false }
slint       = { version = "1.8", default-features = false, features = ["compat-1-2", "std", "backend-winit", "backend-winit-wayland", "renderer-software"] }
slint-build = "1.8"
tempfile    = "3"

bacak-ipc       = { path = "crates/bacak-ipc" }
bacak-sdk       = { path = "crates/bacak-sdk" }
bacak-sdk-slint = { path = "crates/bacak-sdk-slint" }
