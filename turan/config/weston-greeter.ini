# weston-greeter.ini — reference weston configuration for the BDM greeter.
#
# The prototype `bacak-compositor` wrapper generates an equivalent file at
# runtime (and always injects the [autolaunch] greeter path). Copy this to
# /etc/bacak-display-manager/weston-greeter.ini and point the wrapper at it with
# BDM_WESTON_CONFIG to customize outputs, scaling, keymap, etc.

[core]
# Kiosk shell makes the greeter fill the screen with no decorations.
shell=kiosk-shell.so
# Never blank/idle the login screen.
idle-time=0
# Allow running without an input device (useful headless / on first boot).
require-input=false

[autolaunch]
# The greeter; the wrapper overrides this with the daemon's --greeter argument.
path=/usr/bin/bacak-greeter
# Shut weston down when the greeter exits, so the daemon can start the session.
watch=true

[keyboard]
keymap_layout=us

# Example: force a specific output resolution/scale on real hardware.
# [output]
# name=HDMI-A-1
# mode=1920x1080
# scale=1
