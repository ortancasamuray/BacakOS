# /etc/bacak-display-manager.conf
#
# Bacak Display Manager configuration. TOML format. Every key is optional;
# omitted keys fall back to the compiled-in defaults, so this file can be as
# small or as complete as you like. Unknown keys are rejected (typo guard).

[daemon]
greeter_user = "bacak-greeter"
seat         = "seat0"
compositor   = "/usr/bin/bacak-compositor"
ipc_socket   = "/run/bacak-display-manager/greeter.sock"
# Register a logind 'greeter' session so the compositor can take DRM master on
# the seat (needed for weston/bacak-compositor on real hardware). Requires a
# system-pam build. Set false only for nested/dev setups with no real display.
register_greeter_session = true

[autologin]
enabled       = false
# user        = "ayse"
# session     = "bacak"
delay_seconds = 0

[greeter]
show_user_list         = true
remember_last_user     = true
remember_last_session  = true
allow_guest            = false
allow_pin              = false
allow_manual_login     = true
language               = "tr"        # tr | en — greeter UI + auth messages

[theme]
mode   = "dark"          # dark | light | auto
name   = "bacak"
accent = "#3b82f6"
logo   = "/usr/share/bacak-display-manager/logo.svg"

[wallpaper]
mode               = "image"   # solid | image | slideshow
image              = "/usr/share/bacak-display-manager/wallpaper.jpg"
# slideshow_dir    = "/usr/share/backgrounds/bacak"
slideshow_interval = 30
blur_sigma         = 0.0       # > 0 blurs the wallpaper behind the login card

[keyboard]
mode          = "auto"   # auto | always | never
show_on_focus = true
layout        = "trf"    # trf (Turkish F, default) | trq (Turkish Q) | us

[accessibility]
scale         = 1.0      # 1.0 = 100%; 1.25 / 1.5 for HiDPI & touch
large_fonts   = false
high_contrast = false
screen_reader = false

[power]
allow_shutdown  = true
allow_restart   = true
allow_suspend   = true
allow_hibernate = false

[sessions]
wayland_dirs    = ["/usr/share/wayland-sessions"]
xsession_dirs   = ["/usr/share/xsessions"]
default_session = "bacak"
