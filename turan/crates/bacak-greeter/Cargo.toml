[package]
name = "bacak-greeter"
description = "Unprivileged BDM greeter: IPC client core + reference terminal frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bacak-greeter"
path = "src/main.rs"

[lib]
name = "bacak_greeter"
path = "src/lib.rs"

[features]
default = []
# Pulls in the Wayland/egui graphical frontend. Off by default so the IPC client
# core and the reference terminal frontend build without a graphics stack.
gui = ["dep:eframe", "dep:qrcode", "dep:aes-gcm", "dep:base64", "dep:getrandom"]

[dependencies]
bacak-common = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = "1"

# Graphical frontend (feature `gui`). eframe re-exports egui; its default
# features include the glow renderer plus Wayland and X11 winit backends.
eframe = { version = "0.29", optional = true }
# Bacak Onay "QR ile onay" (src/telefon_onayi.rs): the QR on the code prompt
# and the one-time key that seals the code the phone sends back.
qrcode = { version = "0.14", default-features = false, optional = true }
aes-gcm = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
