# BacakOS otomatik güncelleyici ayarları (bacak-guncel).
# Değiştirdikten sonra bir şey yapmaya gerek yok; sonraki çalışmada okunur.

# hayir: güncelleme yapılmaz (yarım kalan kurulumun onarımı yine yapılır).
etkin = evet

# Yalnız pille çalışırken kurulum için en az pil doluluğu (%).
# İndirme her durumda yapılır; kurulum prize takılınca yapılır.
en_az_pil = 40

# Kurulumdan önce kök dosya sisteminde ayrılacak en az boş alan (MB).
en_az_bos_mb = 500

# Başka bir apt/dpkg işlemi sürüyorsa bekleme süresi (saniye).
kilit_bekleme_sn = 600

# Çalışacak eklentiler, sırayla: apt (yerleşik), harici (eklenti.d dizinleri).
eklentiler = apt, harici
