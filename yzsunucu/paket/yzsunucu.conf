# YZsunucu ayarları. Değiştirdikten sonra: systemctl restart yzsunucu

# Tahtaların bağlandığı adres. Tahtada /etc/tahta/yzsunucu dosyasına
# "http://<bu sunucunun adresi>:8790" yazılır.
dinle = 0.0.0.0:8790

# yzsunucu-model-indir bunları buraya kurar.
llama_server = /opt/yzsunucu/llama/llama-server
model = /var/lib/yzsunucu/model/Qwen3VL-8B-Instruct-Q4_K_M.gguf
mmproj = /var/lib/yzsunucu/model/mmproj-Qwen3VL-8B-Instruct-F16.gguf

# llama-server yalnız 127.0.0.1'de bu kapıyı dinler.
llama_port = 8791
# GPU'ya konan katman sayısı (99 = hepsi; GPU yoksa 0, yavaş çalışır).
gpu_katman = 99
baglam = 8192
en_cok_belirtec = 900
