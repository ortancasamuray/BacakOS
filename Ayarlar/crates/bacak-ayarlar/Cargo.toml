[package]
name        = "bacak-ayarlar"
description = "Bacak OS sistem ayarları — Bluetooth ve daha fazlası"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "bacak-ayarlar"
path = "src/main.rs"

[dependencies]
slint        = { workspace = true }
tokio        = { workspace = true }
anyhow       = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[package.metadata.deb]
maintainer           = "Bacak Desktop Project <packages@example.org>"
copyright            = "2026, Bacak Desktop Project"
section              = "utils"
priority             = "optional"
extended-description = "Bacak OS sistem ayarları uygulaması. Bluetooth eşleşme, dosya gönderme ve alma."
depends              = "$auto, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0, libegl1, libgl1, bluez, bluez-obexd"
assets = [
    ["../../target/release/bacak-ayarlar", "usr/bin/", "755"],
    ["../../desktop/bacak-ayarlar.desktop", "usr/share/applications/", "644"],
    ["../../icons/hicolor/scalable/apps/bacak-ayarlar.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
