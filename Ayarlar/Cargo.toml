[workspace]
members = ["crates/bacak-ayarlar"]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2021"
license     = "GPL-3.0-or-later"
authors     = ["Bacak Desktop Project <packages@example.org>"]

[workspace.dependencies]
slint       = { version = "1.8", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "backend-winit-wayland",
    "renderer-software",
    "std",
] }
slint-build = "1.8"
tokio       = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
zbus        = { version = "5", default-features = false, features = ["tokio"] }
zbus_macros = "5"
anyhow      = "1"
futures-util = "0.3"
