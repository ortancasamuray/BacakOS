[package]
name        = "uzakel-daemon"
description = "BacakOS-side remote control & file transfer daemon (input replay + file receive)"
version     = "0.1.0"
edition     = "2021"
license     = "GPL-3.0-or-later"
homepage    = "https://anadolupanteri.org.tr"
repository  = "https://anadolupanteri.org.tr"
authors     = ["Anadolu Panteri <bilgi@anadolupanteri.org.tr>"]

[[bin]]
name = "uzakel-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
input-linux = "0.7"
sha2 = "0.11"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
bitflags = "2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"

[profile.release]
panic = "abort"
lto = true

[package.metadata.deb]
revision = "1"
maintainer = "Anadolu Panteri <bilgi@anadolupanteri.org.tr>"
copyright = "2026, Anadolu Panteri <bilgi@anadolupanteri.org.tr>"
section = "net"
priority = "optional"
depends = "$auto, libnotify-bin"
recommends = "bacak-plugin-uzakel"
extended-description = """\
BacakOS side of Uzakel: lets the Uzakel Android app act as a trackpad and
keyboard for this desktop and send files to it over the local network.
Pairing is PIN/QR based with end-to-end encryption; input is replayed via
/dev/uinput, which the active seat user is granted through logind (uaccess).
Runs as a per-user systemd service, enabled globally on install."""
assets = [
    ["target/release/uzakel-daemon", "usr/bin/", "755"],
    ["paket/uzakel-daemon.service", "usr/lib/systemd/user/", "644"],
    ["paket/70-uzakel-uinput.rules", "usr/lib/udev/rules.d/", "644"],
    ["paket/uzakel-uinput.conf", "usr/lib/modules-load.d/", "644"],
]
maintainer-scripts = "paket/debian/"
