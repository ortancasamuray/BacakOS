[package]
name = "bacak-remote-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "bacak-remote-server"
path = "src/main.rs"

[dependencies]
bacak-remote-proto = { path = "../bacak-remote-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
scrap = "0.5"
zstd = "0.13"
enigo = "0.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# Pairing window: Windows-only (this binary otherwise builds cross-platform,
# but the GUI is what this feature is actually for — see `src/gui.rs`).
[target.'cfg(windows)'.dependencies]
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"
# So the GUI pairing window can detach its auto-allocated console window
# (`FreeConsole`, in `gui.rs`) — the binary stays console-subsystem so the
# `--no-gui`/`--pin` automation path keeps its normal stdout.
winapi = { version = "0.3", features = ["wincon"] }
# Hardware H.264 encode (Intel QSV) — see ../HARDWARE_ENCODE_PLAN.md.
# Needs FFMPEG_DIR pointing at ../vendor/ffmpeg-n9.0-latest-win64-gpl-shared-9.0
# for cross-compiling to x86_64-pc-windows-gnu.
ffmpeg-next = "9.0"
