[package]
name        = "bacak-shell"
description = "Bacak OS shell — GTK4 surfaces (panel, dock, launcher) layered atop the compositor."
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }

[[bin]]
name = "bacak-panel"
path = "src/bin/bacak-panel.rs"

[[bin]]
name = "bacak-dock"
path = "src/bin/bacak-dock.rs"

[[bin]]
name = "bacak-launcher"
path = "src/bin/bacak-launcher.rs"

[dependencies]
bacak-services = { path = "../bacak-services" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GTK4 — gated so a default `cargo check` stays fast. Real Wayland surfaces
# also need gtk4-layer-shell-rs to tell the compositor where to dock.
gtk4 = { version = "0.9", optional = true }
gtk4-layer-shell = { version = "0.5", optional = true }

[features]
default = []
# Enable GTK4 surface rendering. Requires libgtk-4-dev and
# libgtk4-layer-shell-dev on the host.
gtk = ["dep:gtk4", "dep:gtk4-layer-shell"]
