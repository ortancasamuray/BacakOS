# BacakOS Bluetooth desteği içermez: Bluetooth çekirdek modülleri hiçbir
# yoldan (donanım algılama, başka bir modülün bağımlılığı, elle modprobe)
# yüklenmesin. Böylece radyo kapalı kalır ve bluetoothd bir bağdaştırıcı
# bulamaz. Kaldırmak için bu dosyayı silip yeniden başlatın.
blacklist bluetooth
blacklist btusb
blacklist btrtl
blacklist btintel
blacklist btbcm
blacklist btmtk
blacklist btqca
blacklist hci_uart
blacklist bnep
blacklist rfcomm
install bluetooth /bin/false
install btusb /bin/false
install hci_uart /bin/false
