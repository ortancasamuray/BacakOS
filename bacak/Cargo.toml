[workspace]
resolver = "2"
members = [
    "crates/bacak-services",
    "crates/bacak-compositor",
    "crates/bacak-shell",
    "crates/bacak-cli",
    "crates/bacak-plugin-network",
    "crates/bacak-plugin-audio",
    "crates/bacak-plugin-desktop-settings",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
authors     = ["Bacak OS contributors"]
repository  = "https://github.com/bacak-os/bacak"
rust-version = "1.75"

[workspace.dependencies]
tokio       = { version = "1.40", features = ["fs", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"
thiserror   = "1.0"
anyhow      = "1.0"
parking_lot = "0.12"
tracing     = "0.1"

# Filesystem
notify      = "6.1"

# Archive backends
zip         = { version = "0.6", default-features = false, features = ["deflate"] }
tar         = "0.4"
flate2      = "1.0"

# CLI
clap        = { version = "4.5", features = ["derive"] }

# Text rendering — pure-Rust glyph rasteriser for compositor overlays
fontdue     = "0.9"

# Rich text layout + shaping for *selectable* compositor-native text (Tier A
# selection): proper line wrapping, cursor hit-testing and selection ranges.
# Heavier than fontdue (swash/rustybuzz/fontdb), so it's runtime-gated.
cosmic-text = "0.15"

# AT-SPI2 (accessibility) bridge over D-Bus for Tier C selection — accurate
# text geometry/selection from real apps (GTK/Qt/Chromium/Firefox). Uses the
# blocking API on a side thread, so default (async-io) features. Runtime-gated.
zbus = "5"

# Image decode — PNG only (app icons); default features off keeps the
# jpeg/gif/webp decoders out of the build.
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# SVG rasteriser for scalable app icons (pure-Rust: usvg + tiny-skia).
resvg       = { version = "0.47", default-features = false }

# XDG icon-theme resolver: active theme + Inherits chain + hicolor + pixmaps,
# size/format aware. We hand it the Icon= name; it returns a PNG/SVG path
# which our resvg/image decode pipeline rasterises.
freedesktop-icons = { version = "0.4", default-features = false }

# Signal handling (SIGTERM/SIGINT → flush session on clean shutdown).
libc        = "0.2"

[profile.release]
lto         = "thin"
codegen-units = 1
strip       = "symbols"
opt-level   = 3
