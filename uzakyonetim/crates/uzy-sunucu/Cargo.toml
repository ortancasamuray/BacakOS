[package]
name = "uzy-sunucu"
description = "Uzak Yönetim sunucusu — BacakOS filosu için web paneli ve ajan kapısı"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "uzakyonetim-sunucu"
path = "src/main.rs"

[dependencies]
uzy-proto.workspace = true
bacakonay-core.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
sha2.workspace = true
getrandom.workspace = true
zeroize.workspace = true
libc.workspace = true
log.workspace = true
env_logger.workspace = true
qrcode.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "uzakyonetim-sunucu"
revision = "3"
maintainer = "Anadolu Panteri <bilgi@anadolupanteri.org.tr>"
copyright = "2026, Anadolu Panteri <bilgi@anadolupanteri.org.tr>"
section = "admin"
priority = "optional"
depends = "$auto, adduser, iproute2, sqlite3"
extended-description = """\
Central server for managing a fleet of BacakOS machines across networks:
web panel (HTTPS, password + Bacak Onay two-factor login) and an mTLS
gateway that agents dial out to. Create accounts with Bacak Onay enrollment
on remote machines and view their screens at a configurable interval. Every
action is written to an audit log."""
assets = [
    ["target/release/uzakyonetim-sunucu", "usr/bin/", "755"],
    ["../../paket/uzakyonetim-sunucu.service", "lib/systemd/system/", "644"],
]
maintainer-scripts = "../../paket/sunucu-debian/"
# The unit stays in /lib: moving it to /usr/lib within this package can lose
# it on upgrade under usrmerge (DEP17). postinst/prerm enable and stop it.
systemd-units = { unit-name = "uzakyonetim-sunucu", enable = false, start = false }
