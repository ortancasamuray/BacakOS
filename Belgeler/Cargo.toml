[workspace]
members = [
    "crates/bacak-belge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Bacak Desktop Project <packages@example.org>"]

[workspace.dependencies]
slint = { version = "1.8", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "backend-winit-wayland",
    "renderer-software",
    "std",
] }
slint-build = "1.8"
anyhow     = "1"
image      = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "pnm", "qoi", "hdr",
] }
