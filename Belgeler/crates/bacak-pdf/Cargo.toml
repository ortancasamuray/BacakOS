[package]
name        = "bacak-pdf"
description = "Bacak OS PDF reader powered by MuPDF"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true

[[bin]]
name = "bacak-pdf"
path = "src/main.rs"

[dependencies]
slint  = { workspace = true }
anyhow = { workspace = true }
mupdf  = "0.4"

[build-dependencies]
slint-build = { workspace = true }

[package.metadata.deb]
maintainer = "Bacak Desktop Project <packages@example.org>"
copyright  = "2026, Bacak Desktop Project"
section    = "text"
priority   = "optional"
extended-description = "Bacak OS PDF reader powered by MuPDF with page navigation and zoom."
depends    = "$auto, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0, libegl1, libgl1, libmupdf25.1"
assets = [
    ["../../target/release/bacak-pdf", "usr/bin/", "755"],
    ["../../desktop/bacak-pdf.desktop", "usr/share/applications/", "644"],
    ["../../icons/hicolor/scalable/apps/application-pdf.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
