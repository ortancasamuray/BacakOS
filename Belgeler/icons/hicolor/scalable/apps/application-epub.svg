<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- book cover -->
  <rect x="10" y="6" width="36" height="50" rx="3" fill="#4a90d9"/>
  <!-- spine -->
  <rect x="10" y="6" width="6" height="50" rx="3" fill="#2e6fb3"/>
  <!-- pages edge -->
  <rect x="44" y="8" width="4" height="46" rx="1" fill="#ddeeff"/>
  <!-- text lines -->
  <rect x="20" y="16" width="20" height="2" rx="1" fill="white" opacity="0.8"/>
  <rect x="20" y="22" width="20" height="2" rx="1" fill="white" opacity="0.8"/>
  <rect x="20" y="28" width="20" height="2" rx="1" fill="white" opacity="0.8"/>
  <rect x="20" y="34" width="14" height="2" rx="1" fill="white" opacity="0.6"/>
  <!-- EPUB badge -->
  <rect x="14" y="42" width="26" height="10" rx="2" fill="#1a4a7a"/>
  <text x="27" y="51" font-family="sans-serif" font-weight="bold" font-size="8" fill="white" text-anchor="middle">EPUB</text>
</svg>
